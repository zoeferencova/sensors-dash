<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 224" width="900" height="224" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="224" fill="#ffffff"/>
  <style>
    .h { font-size: 14px; font-weight: 700; fill: #1a1a1a; }
    .b { font-size: 11.5px; fill: #333333; }
    .n { font-size: 11px; fill: #6b6b6b; }
  </style>

  <text x="0" y="20" class="h">Why the confirmation window has width</text>
  <text x="0" y="40" class="b">A flood wave travels faster when the channel is full, which is exactly when floods happen, so it can arrive early.</text>

  <rect x="248" y="64" width="197" height="46" fill="#e8edf1" stroke="#5b7186"/>
  <line x1="347" y1="58" x2="347" y2="118" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="405" y="74" width="14" height="36" fill="#1a1a1a"/>

  <line x1="150" y1="110" x2="770" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="740" cy="110" r="6" fill="#1a1a1a"/>
  <text x="740" y="56" class="n" text-anchor="middle">S03 reads high</text>

  <text x="150" y="128" class="n" text-anchor="middle">&#8211;90</text>
  <text x="248" y="128" class="n" text-anchor="middle">&#8211;75</text>
  <text x="347" y="128" class="n" text-anchor="middle">&#8211;60</text>
  <text x="445" y="128" class="n" text-anchor="middle">&#8211;45</text>
  <text x="544" y="128" class="n" text-anchor="middle">&#8211;30</text>
  <text x="642" y="128" class="n" text-anchor="middle">&#8211;15</text>
  <text x="740" y="128" class="n" text-anchor="middle">now</text>
  <text x="790" y="128" class="n">minutes ago</text>

  <rect x="0" y="150" width="12" height="12" fill="#1a1a1a"/>
  <text x="18" y="160" class="n">rain actually fell, 50 min ago</text>
  <rect x="230" y="150" width="12" height="12" fill="#e8edf1" stroke="#5b7186"/>
  <text x="248" y="160" class="n">the window searched, 45 to 75 min ago</text>
  <line x1="530" y1="148" x2="530" y2="164" stroke="#8a8a8a" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="542" y="160" class="n">the 60-minute point estimate (S03&#8217;s lag)</text>

  <text x="0" y="192" class="b">Checking only the point estimate finds no rain, so a real flood would be recorded as a possible fault.</text>
  <text x="0" y="212" class="b">Checking the window finds the rain at 50 minutes, and the flood is correctly confirmed.</text>
</svg>
