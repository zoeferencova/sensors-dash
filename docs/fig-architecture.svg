<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 466" width="900" height="466" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="466" fill="#ffffff"/>
  <style>
    .h  { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
    .b  { font-size: 11.5px; fill: #333333; }
    .c  { font-size: 11px; font-family: Consolas, monospace; fill: #2d7d7d; }
    .n  { font-size: 11px; fill: #6b6b6b; }
    .sec{ font-size: 11px; font-weight: 700; fill: #6b6b6b; letter-spacing: 0.05em; }
  </style>

  <text x="0" y="22" class="h" style="font-size:15px">System architecture and data flow</text>

  <text x="0" y="48" class="sec">INPUT &#8212; GENERATED SEPARATELY IN R (CoSMoS)</text>
  <rect x="0" y="56" width="900" height="52" fill="#f0f0f0" stroke="#1a1a1a" stroke-width="2"/>
  <text x="16" y="78" class="c">data/sensor_data.json</text>
  <text x="200" y="78" class="b">7,776 records &#183; 864 timesteps &#183; 5 min</text>
  <text x="16" y="98" class="b">Lags (S02 +9, S03 +12, S04 +15) are already applied in the data, not by the dashboard.</text>

  <path d="M 154 108 L 154 150" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="154,158 149,146 159,146" fill="#1a1a1a"/>

  <text x="300" y="142" class="sec">THIS SYSTEM &#8212; PYTHON / DASH</text>
  <rect x="0" y="158" width="900" height="272" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="14" y="174" width="872" height="50" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="28" y="196" class="h">1. Load once</text>
  <text x="150" y="196" class="b">clean, sort, hold in memory; never modified after this</text>
  <text x="28" y="215" class="c">load_long() &#8594; clean_readings() &#8594; READINGS &#160;&#183;&#160; build_timeline() &#8594; TIMELINE</text>

  <path d="M 154 224 L 154 238" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="154,244 150,235 158,235" fill="#8a8a8a"/>
  <text x="168" y="240" class="n">then, on every tick:</text>

  <rect x="14" y="246" width="281" height="62" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="28" y="268" class="h">2. Replay</text>
  <text x="28" y="290" class="b">every row up to the current step</text>

  <path d="M 297 277 L 302 277" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="308,277 299,273 299,281" fill="#8a8a8a"/>

  <rect x="309" y="246" width="281" height="62" fill="#fafafa" stroke="#c8c8c8"/>
  <text x="323" y="268" class="h">3. Overlay <tspan class="n" style="font-weight:400">(optional)</tspan></text>
  <text x="323" y="290" class="b">a scenario, painted onto a copy</text>

  <path d="M 592 277 L 597 277" stroke="#8a8a8a" stroke-width="1.5"/>
  <polygon points="603,277 594,273 594,281" fill="#8a8a8a"/>

  <rect x="604" y="246" width="282" height="62" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
  <text x="618" y="268" class="h">4. Assess</text>
  <text x="748" y="268" class="c">assess_risk()</text>
  <text x="618" y="290" class="b">a verdict per sensor, plus one overall state</text>

  <path d="M 745 308 L 745 320 L 450 320 L 450 328" stroke="#8a8a8a" stroke-width="1.5" fill="none"/>
  <polygon points="450,334 446,325 454,325" fill="#8a8a8a"/>

  <rect x="14" y="336" width="872" height="80" fill="#ffffff" stroke="#c8c8c8"/>
  <text x="28" y="358" class="h">Display</text>
  <text x="110" y="358" class="b">all four views read that one result</text>

  <line x1="235" y1="368" x2="235" y2="404" stroke="#e4e4e4" stroke-width="1"/>
  <line x1="456" y1="368" x2="456" y2="404" stroke="#e4e4e4" stroke-width="1"/>
  <line x1="677" y1="368" x2="677" y2="404" stroke="#e4e4e4" stroke-width="1"/>

  <text x="28" y="384" class="h" style="font-size:12px">Charts</text>
  <text x="28" y="402" class="b">level + rainfall, one sensor</text>

  <text x="249" y="384" class="h" style="font-size:12px">Map</text>
  <text x="249" y="402" class="b">four pins, coloured by state</text>

  <text x="470" y="384" class="h" style="font-size:12px">Panels</text>
  <text x="470" y="402" class="b">readings + rule breakdown</text>

  <text x="691" y="384" class="h" style="font-size:12px">Event log</text>
  <text x="691" y="402" class="b">state changes only</text>

  <text x="0" y="454" class="b">Steps 1 to 4 are plain Python and pandas. Only the display layer uses Dash.</text>
</svg>
